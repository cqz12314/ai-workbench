[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench-backend"
version = "0.1.0"
description = "FastAPI backend for AI Workbench"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "litellm>=1.55,<2.0",
    "mcp>=2.0,<3.0",
    "pypdf>=5.0,<7.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.18,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
